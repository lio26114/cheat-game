name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Java 17 (for Gradle 7.6.4 compatibility)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Install dependencies
      run: npm ci

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Apply comprehensive compatibility fixes
      run: |
        # Define paths
        SETTINGS_MANAGER="node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-settings-plugin/src/main/kotlin/expo/modules/plugin/SettingsManager.kt"
        PLUGIN_FILE="node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-settings-plugin/src/main/kotlin/expo/modules/plugin/ExpoAutolinkingSettingsPlugin.kt"
        
        # Fix 1: Remove incompatible Kotlin DSL import
        sed -i '/import org.gradle.kotlin.dsl.the/d' "$SETTINGS_MANAGER"
        sed -i '/import org.gradle.kotlin.dsl.the/d' "$PLUGIN_FILE"
        
        # Fix 2: Replace settings.extensions with settings.getExtensions() for Gradle 7.x compatibility
        sed -i 's/settings\.extensions\./settings\.getExtensions()\./g' "$SETTINGS_MANAGER"
        sed -i 's/settings\.extensions\./settings\.getExtensions()\./g' "$PLUGIN_FILE"
        
        # Fix 3: Replace project.extensions with project.getExtensions() for Gradle 7.x compatibility
        sed -i 's/project\.extensions\./project\.getExtensions()\./g' "$SETTINGS_MANAGER"
        sed -i 's/project\.extensions\./project\.getExtensions()\./g' "$PLUGIN_FILE"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30
